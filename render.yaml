databases:
  - name: life-auction-db
    databaseName: lifeauction
    user: lifeauction

services:
  - type: web
    name: life-auction-classroom
    runtime: node
    buildCommand: node assemble.js && npm install
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: life-auction-db
          property: connectionString
      - key: ADMIN_PIN
        sync: false
