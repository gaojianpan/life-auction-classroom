databases:
  - name: life-auction-db
    databaseName: life_auction_db
    user: life_auction_db_user
    plan: 0.1c-256mb
    diskSizeGB: 1

services:
  - type: web
    name: life-auction-app
    runtime: node
    plan: free
    region: singapore
    buildCommand: node assemble.js && npm install
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: life-auction-db
          property: connectionString
      - key: ADMIN_PIN
        sync: false
      - key: RUN_SMOKE_TEST
        value: "0"
